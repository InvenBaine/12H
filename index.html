<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12시에 만나요 - Market Ticker</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        /* [12시에 만나요] 시그니처 스타일 */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* 방송 송출용 투명 */
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .ticker-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: #001529; /* 로고 네이비 */
            display: flex;
            align-items: center;
            border-top: 3px solid #ff85c0; /* 로고 핑크 라인 */
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        /* 시계 영역: 로고 메인 핑크색 */
        #current-time {
            background: #ff85c0; 
            color: #ffffff;
            padding: 0 25px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .ticker-wrap {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 45s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .item {
            display: inline-block;
            padding: 0 50px;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .label {
            color: #ffd6e7; /* 보조 핑크 */
            margin-right: 12px;
            font-size: 1rem;
            opacity: 0.9;
        }

        /* 지수 등락 컬러 */
        .up { color: #ff85c0 !important; }   /* 상승: 핑크 */
        .down { color: #91d5ff !important; } /* 하락: 스카이블루 */

        .percent {
            font-size: 0.95rem;
            margin-left: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="ticker-container">
        <div id="current-time">00:00:00</div>
        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-content">
                <span class="item">데이터를 불러오는 중입니다...</span>
            </div>
        </div>
    </div>

    <script src="market.js"></script>
</body>
</html>
