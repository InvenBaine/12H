<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주식 아가방 Ticker - Pink Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body { margin: 0; padding: 0; background-color: transparent; overflow: hidden; font-family: 'Jua', sans-serif; }
        
        .ticker-wrapper {
            display: flex;
            width: 1920px;
            height: 60px;
            background: linear-gradient(90deg, #2D033B 0%, #810CA8 100%); /* 진보라 그라데이션 */
            border-top: 4px solid #FF008E; /* 핫핑크 상단 바 */
            box-shadow: 0px -5px 15px rgba(255, 0, 142, 0.3);
            align-items: center;
        }

        .ticker-title {
            background: #FF008E; /* 케데헌 핑크 */
            color: #fff;
            font-weight: bold;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 1.4rem;
            text-shadow: 2px 2px 0px #2D033B;
            z-index: 10;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 35s linear infinite;
            color: #FFD6FF; /* 연분홍 글자색 */
            font-size: 1.3rem;
        }

        .item { 
            margin-right: 70px; 
            display: inline-flex; 
            align-items: center;
        }

        /* 등락에 따른 네온 효과 */
        .up { color: #FF4D4D; text-shadow: 0 0 8px rgba(255, 77, 77, 0.8); }
        .down { color: #4D94FF; text-shadow: 0 0 8px rgba(77, 148, 255, 0.8); }
        .percent { font-size: 0.9rem; margin-left: 5px; opacity: 0.9; }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <div class="ticker-wrapper">
        <div class="ticker-title">💖 MARKET LIVE</div>
        <div class="ticker-container">
            <div id="ticker-content" class="ticker-move">캔디 지수 로딩 중... ✨</div>
        </div>
    </div>
    <script src="market.js"></script>
</body>
</html>
