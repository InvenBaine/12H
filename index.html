<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주식 아가방 Ticker - KR Market Ver.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap');

        body { margin: 0; padding: 0; background-color: transparent; overflow: hidden; font-family: 'Gaegu', cursive; }
        
        .ticker-wrapper {
            display: flex;
            width: 1920px;
            height: 90px; /* 가시성을 위해 높이 상향 */
            background-color: #F2C1D1;
            border-top: 6px solid #78C2AD;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.15);
        }

        .ticker-title {
            background-color: #F9E076;
            color: #4A4A4A;
            padding: 0 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            border-right: 5px dashed #F2C1D1;
            z-index: 10;
            min-width: 280px;
        }

        #current-time { font-size: 1.2rem; color: #555; margin-top: 2px; }
        .status-badge { 
            background: #fff; 
            padding: 2px 8px; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            margin-left: 5px; 
            vertical-align: middle;
            border: 1px solid #78C2AD;
        }

        .ticker-container { flex: 1; overflow: hidden; white-space: nowrap; }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 45s linear infinite;
            color: #333;
            font-size: 2.4rem; /* 지수 폰트 크기 극대화 */
            line-height: 90px;
        }

        .group-label {
            background: #78C2AD;
            color: white;
            padding: 0 15px;
            border-radius: 20px;
            font-size: 1.4rem;
            margin: 0 20px;
            vertical-align: middle;
        }

        .item { margin-right: 120px; display: inline-flex; align-items: center; }
        .up { color: #E84A5F; font-weight: bold; }
        .down { color: #35858B; font-weight: bold; }
        .percent { font-size: 1.5rem; margin-left: 10px; opacity: 0.8; }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <div class="ticker-wrapper">
        <div class="ticker-title">
            <span>⭐ 주식 아가방</span>
            <div id="current-time">00:00:00 <span id="market-status" class="status-badge">-</span></div>
        </div>
        <div class="ticker-container">
            <div id="ticker-content" class="ticker-move">데이터 연결 중... ✨</div>
        </div>
    </div>
    <script src="market.js"></script>
</body>
</html>
