<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12H Market Ticker</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* OBS 소스 추가 시 투명하게 */
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        /* 하단 전광판 컨테이너 */
        .ticker-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            border-top: 2px solid #444;
        }

        /* 시계 영역 */
        .time-box {
            background: #222;
            color: #fff;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            border-right: 1px solid #444;
            z-index: 10;
        }

        /* 티커 흐르는 영역 */
        .ticker-wrap {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 40s linear infinite; /* 속도 조절 가능 */
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* 개별 지수 스타일 */
        .item {
            display: inline-block;
            padding: 0 40px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .label { color: #aaa; margin-right: 10px; font-size: 0.95rem; }
        .up { color: #ff4d4d; }   /* 상승: 빨강 */
        .down { color: #4da6ff; } /* 하락: 파랑 */
        .percent { font-size: 0.9rem; margin-left: 5px; opacity: 0.9; }
        
        .status-badge {
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 3px;
            background: #444;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="ticker-container">
        <div class="time-box" id="current-time">00:00:00</div>
        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-content">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>

    <script src="market.js"></script>
</body>
</html>
