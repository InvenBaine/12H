<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주식 아가방 Ticker - Pastel Edition</title>
    <style>
        /* 손글씨 느낌의 둥근 폰트 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap');

        body { margin: 0; padding: 0; background-color: transparent; overflow: hidden; font-family: 'Gaegu', cursive; }
        
        .ticker-wrapper {
            display: flex;
            width: 1920px;
            height: 65px;
            background-color: #F2C1D1; /* 로고의 연한 핑크 배경색 */
            border-top: 5px solid #78C2AD; /* 로고의 민트색 포인트 */
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .ticker-title {
            background-color: #F9E076; /* 로고의 노란색 */
            color: #4A4A4A;
            padding: 0 35px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            border-right: 3px dashed #F2C1D1;
            z-index: 10;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 45s linear infinite; /* 조금 더 여유로운 속도 */
            color: #4A4A4A;
            font-size: 1.5rem;
            padding-left: 20px;
        }

        .item { 
            margin-right: 80px; 
            display: inline-flex; 
            align-items: center;
        }

        /* 지수 등락에 따른 색상 (로고 톤에 맞춰 조정) */
        .up { color: #E84A5F; font-weight: bold; } /* 따뜻한 빨강 */
        .down { color: #35858B; font-weight: bold; } /* 차분한 청록 */
        .percent { font-size: 1rem; margin-left: 8px; background: rgba(255,255,255,0.4); padding: 2px 6px; border-radius: 10px; }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <div class="ticker-wrapper">
        <div class="ticker-title">⭐ 주식 아가방</div>
        <div class="ticker-container">
            <div id="ticker-content" class="ticker-move">오늘의 시장 상황은 어떨까요? 로딩 중...</div>
        </div>
    </div>
    <script src="market.js"></script>
</body>
</html>
